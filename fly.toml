# Reconstructed from flyctl config show on 2026-10-17.
# Existing app belongs to organization muaaz-amr.
app = "elmontaqa"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[[mounts]]
  source = "elmontaqa_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"
